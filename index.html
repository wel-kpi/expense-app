<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経費精算メモ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">経費精算メモ</span>
    <span id="appVersion" class="text-white-50 small ms-1"></span>
    <div class="d-flex align-items-center gap-2">
      <select id="monthSelect" class="form-select form-select-sm" style="width:auto;"></select>
      <button id="settingsBtn" class="btn btn-sm btn-outline-light" title="設定">⚙</button>
    </div>
  </div>
</nav>

<div class="container">

  <!-- Dashboard -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>当月サマリー</strong>
      <div>
        <span id="monthTotal" class="fs-5 fw-bold"></span>
      </div>
    </div>
    <div class="card-body p-0">
      <table class="table table-sm mb-0" id="summaryTable">
        <thead><tr><th>内容（カテゴリ）</th><th class="text-end">今月</th><th class="text-end">前月比</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">経費一覧</h5>
    <div class="d-flex gap-2">
      <button id="exportBtn" class="btn btn-success btn-sm">Excel出力</button>
      <button id="addBtn" class="btn btn-primary btn-sm">＋ 経費を登録</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle" id="expenseTable">
      <thead>
        <tr>
          <th>支払日</th><th>支払先</th><th>内容</th><th>利用目的</th>
          <th class="text-end">支払額</th><th>領収書</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="text-muted text-center" id="emptyMsg">この月の経費データはまだありません。</p>
</div>

<!-- Expense Form Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="expenseModalTitle">経費を登録</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="expenseForm">
          <input type="hidden" id="expenseId">

          <div class="mb-3">
            <label class="form-label">領収書画像</label>
            <input class="form-control" type="file" id="receiptInput" accept="image/*" capture="environment">
            <div id="ocrStatus" class="form-text"></div>
            <div class="mt-2 text-center">
              <img id="receiptPreview" class="img-fluid rounded border d-none" style="max-height:280px;">
            </div>
          </div>

          <div id="multiReceiptSection" class="d-none mb-3">
            <div class="alert alert-info small mb-2">複数の領収書を検出しました。内容を確認して「まとめて登録」してください（支払日・利用目的は下の入力欄の値が共通で使われます）。</div>
            <div id="multiReceiptRows"></div>
            <button type="button" class="btn btn-success btn-sm" id="multiSaveBtn">まとめて登録</button>
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">支払日</label>
              <input type="date" class="form-control" id="fieldDate" required>
            </div>
            <div class="col-6">
              <label class="form-label">支払額</label>
              <input type="number" class="form-control" id="fieldAmount" min="0" step="1" required>
            </div>
          </div>

          <div class="mb-2 mt-2">
            <label class="form-label">支払先</label>
            <input type="text" class="form-control" id="fieldPayee" required>
          </div>

          <div class="mb-2">
            <label class="form-label">登録番号</label>
            <input type="text" class="form-control" id="fieldRegNo" placeholder="T1234567890123">
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">内容</label>
              <select class="form-select" id="fieldCategory">
                <option>交通費</option>
                <option>接待費</option>
                <option>会議費</option>
                <option>消耗品費</option>
                <option>通信費</option>
                <option>その他</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">同席人数（任意）</label>
              <input type="number" class="form-control" id="fieldAttendees" min="0" step="1">
            </div>
          </div>

          <div class="mb-2 mt-2">
            <label class="form-label">利用目的（対象者）</label>
            <input type="text" class="form-control" id="fieldPurpose" placeholder="例: A社 山田様との商談">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-primary" id="saveExpenseBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">設定</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">氏名（ファイル名用の略称）</label>
        <input type="text" class="form-control" id="settingUserName" placeholder="渡邉">
        <label class="form-label mt-3">氏名（フルネーム・書類の氏名欄に表示）</label>
        <input type="text" class="form-control" id="settingFullName" placeholder="渡邉　将貴">
        <label class="form-label mt-3">社員コード</label>
        <input type="text" class="form-control" id="settingEmployeeCode" placeholder="任意">
        <label class="form-label mt-3">会社名</label>
        <input type="text" class="form-control" id="settingCompanyName" placeholder="WELNAC 株式会社">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="saveSettingsBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Preview Modal (receipt zoom) -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark">
      <div class="modal-body text-center">
        <img id="previewImage" class="img-fluid">
      </div>
    </div>
  </div>
</div>

<div id="toastHost" class="position-fixed bottom-0 end-0 p-3" style="z-index:1080;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="./version.js"></script>
<script src="./db.js"></script>
<script src="./ocr.js"></script>
<script src="./excel.js"></script>
<script src="./app.js"></script>
</body>
</html>
